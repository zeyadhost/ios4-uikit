name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: ios4-uikit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser smoke test
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          server_pid=$!
          chrome_profile="$(mktemp -d "$RUNNER_TEMP/chrome.XXXXXX")"
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=0 --user-data-dir="$chrome_profile" about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$server_pid" "$chrome_pid" 2>/dev/null || true' EXIT
          for attempt in {1..150}; do
            if [[ -s "$chrome_profile/DevToolsActivePort" ]] || ! kill -0 "$chrome_pid" 2>/dev/null; then break; fi
            sleep .2
          done
          if [[ ! -s "$chrome_profile/DevToolsActivePort" ]]; then
            printf 'Chrome did not open a DevTools port. Startup log:\n' >&2
            tail -n 50 "$RUNNER_TEMP/chrome.log" >&2
            exit 1
          fi
          export CHROME_CDP="http://127.0.0.1:$(head -n 1 "$chrome_profile/DevToolsActivePort")"
          node ios4-uikit/tests/gallery.mjs http://127.0.0.1:8080/ios4-uikit/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir _site
          cp index.html legacy.css gallery.css gallery.js specimens.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
