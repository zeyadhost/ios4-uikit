name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ios4-uikit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser smoke test
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          google-chrome --headless --no-sandbox --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/chrome" about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &
          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:9222/json/version > /dev/null 2>&1; then break; fi
            sleep .2
          done
          node ios4-uikit/tests/gallery.mjs http://127.0.0.1:8080/ios4-uikit/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir _site
          cp index.html legacy.css gallery.css gallery.js specimens.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
